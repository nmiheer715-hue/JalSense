<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" class="sch" viewBox="0 0 1000 262" role="img" aria-label="Sheet 1, power: the 12 volt adapter feeds the valve and pump rail and an LM2596 buck module set to 5 volts. The 5 volt rail feeds the turbidity and flow sensors and, through diode D4, the ESP32 VIN pin. The ESP32 regulator supplies 3.3 volts. All grounds are common.">
<style>
.sch { color: #132329; font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; }
.sch text { fill: currentColor; font-size: 12px; }
.sch .ttl { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 13px; }
.sch .mu { fill: #4B5D64; }
.sch .w { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sch .bx { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.sch .md { fill: #E1EAE8; stroke: currentColor; stroke-width: 1.4; }
.sch .res, .sch .sw { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.sch .pl { stroke: currentColor; stroke-width: 2.6; }
.sch .dot { fill: currentColor; }
.sch .tag rect { fill: #D5EAED; stroke: #136C7D; stroke-width: 1.2; }
.sch .tag text { fill: #136C7D; font-weight: 600; }
.sch .tag.pwr rect { fill: #F5E2D5; stroke: #A04A15; }
.sch .tag.pwr text { fill: #A04A15; }
.sch .dio { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.fc text { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: currentColor; }
.fc .b { font-weight: 600; }
.fc .proc { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.fc .term { fill: #E1EAE8; stroke: currentColor; stroke-width: 1.4; }
.fc .byp { fill: #D5EAED; stroke: #136C7D; stroke-width: 1.6; }
.fc .ro { fill: #F5E2D5; stroke: #A04A15; stroke-width: 1.6; }
.fc .tt { fill: #136C7D; }
.fc .tc { fill: #A04A15; }
.fc .yn { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #4B5D64; }
.rig .tube { fill: none; stroke: #136C7D; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.rig .water { fill: #D5EAED; stroke: none; }
.rig .vessel { fill: none; stroke: currentColor; stroke-width: 1.6; }
.rig .probe { stroke: currentColor; stroke-width: 2.4; }
.rig .cable { stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
</style>
<defs>
<g id="gnd" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="4" x2="6" y2="4"/><line x1="-2" y1="8" x2="2" y2="8"/></g>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#136C7D"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="262" fill="#FAFCFC"/>
      <!-- J1 -->
      <text class="ttl" x="30" y="58">J1 · 12 V 2 A adapter</text>
      <rect class="bx" x="30" y="70" width="120" height="90" rx="4"/>
      <text x="140" y="104" text-anchor="end">+12V</text>
      <text x="140" y="144" text-anchor="end">GND</text>
      <path class="w" d="M150 100 H380"/>
      <path class="w" d="M150 140 H170 V210 H765"/>
      <!-- 12V tag -->
      <path class="w" d="M210 100 V46"/><circle class="dot" cx="210" cy="100" r="3.2"/>
      <g class="tag pwr"><rect x="120" y="24" width="180" height="22" rx="4"/><text x="210" y="39" text-anchor="middle">+12V → Q1–Q3 loads</text></g>
      <!-- C1 -->
      <circle class="dot" cx="280" cy="100" r="3.2"/>
      <path class="w" d="M280 100 V148 M280 156 V210"/>
      <line class="pl" x1="266" y1="148" x2="294" y2="148"/><line class="pl" x1="266" y1="156" x2="294" y2="156"/>
      <text x="298" y="144">+</text>
      <text x="292" y="188">C1 470 µF 25 V</text>
      <circle class="dot" cx="280" cy="210" r="3.2"/>
      <!-- LM2596 -->
      <text class="ttl" x="380" y="66">U2 · LM2596 buck module</text>
      <rect class="md" x="380" y="78" width="160" height="94" rx="4"/>
      <text x="390" y="104">IN+</text><text x="390" y="154">IN−</text>
      <text x="530" y="104" text-anchor="end">OUT+</text><text x="530" y="154" text-anchor="end">OUT−</text>
      <text class="mu" x="460" y="132" text-anchor="middle">set 5.00 V</text>
      <path class="w" d="M380 150 H360 V210"/><circle class="dot" cx="360" cy="210" r="3.2"/>
      <path class="w" d="M540 150 H560 V210"/><circle class="dot" cx="560" cy="210" r="3.2"/>
      <path class="w" d="M540 100 H700"/>
      <!-- C2 -->
      <circle class="dot" cx="600" cy="100" r="3.2"/>
      <path class="w" d="M600 100 V148 M600 156 V210"/>
      <line class="pl" x1="586" y1="148" x2="614" y2="148"/><line class="pl" x1="586" y1="156" x2="614" y2="156"/>
      <text x="618" y="144">+</text>
      <text x="612" y="188">C2 100 µF</text>
      <circle class="dot" cx="600" cy="210" r="3.2"/>
      <!-- 5V tag -->
      <circle class="dot" cx="650" cy="100" r="3.2"/>
      <path class="w" d="M650 100 V46"/>
      <g class="tag pwr"><rect x="560" y="24" width="180" height="22" rx="4"/><text x="650" y="39" text-anchor="middle">+5V → turbidity, flow</text></g>
      <!-- D4 -->
      <polygon class="dio" points="700,88 700,112 724,100"/>
      <line class="pl" x1="724" y1="88" x2="724" y2="112"/>
      <path class="w" d="M724 100 H780"/>
      <text x="712" y="80" text-anchor="middle">D4 1N5819</text>
      <!-- ground symbol -->
      <path class="w" d="M470 210 V222"/><use href="#gnd" x="470" y="222"/>
      <!-- ESP32 -->
      <text class="ttl" x="780" y="60">U1 · ESP32 DevKit</text>
      <rect class="md" x="780" y="70" width="130" height="110" rx="4"/>
      <text x="790" y="104">VIN</text><text x="790" y="154">GND</text>
      <text x="870" y="172" text-anchor="middle">3V3</text>
      <path class="w" d="M780 150 H765 V210"/>
      <path class="w" d="M870 180 V228"/>
      <g class="tag pwr"><rect x="775" y="228" width="190" height="22" rx="4"/><text x="870" y="243" text-anchor="middle">+3V3 → logic, sensors</text></g>
    </svg>
