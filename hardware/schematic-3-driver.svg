<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" class="sch" viewBox="0 0 720 300" role="img" aria-label="Sheet 3, one load driver channel, built three times: the GPIO drives the gate of an IRLZ44N MOSFET through a 220 ohm resistor, with a 10 k pull-down from gate to ground. The source goes to ground; the drain goes to the load's negative terminal; the load's positive terminal goes to 12 volts, and a 1N5819 diode sits across the load with its band towards 12 volts.">
<style>
.sch { color: #132329; font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; }
.sch text { fill: currentColor; font-size: 12px; }
.sch .ttl { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 13px; }
.sch .mu { fill: #4B5D64; }
.sch .w { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sch .bx { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.sch .md { fill: #E1EAE8; stroke: currentColor; stroke-width: 1.4; }
.sch .res, .sch .sw { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.sch .pl { stroke: currentColor; stroke-width: 2.6; }
.sch .dot { fill: currentColor; }
.sch .tag rect { fill: #D5EAED; stroke: #136C7D; stroke-width: 1.2; }
.sch .tag text { fill: #136C7D; font-weight: 600; }
.sch .tag.pwr rect { fill: #F5E2D5; stroke: #A04A15; }
.sch .tag.pwr text { fill: #A04A15; }
.sch .dio { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.fc text { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: currentColor; }
.fc .b { font-weight: 600; }
.fc .proc { fill: #FAFCFC; stroke: currentColor; stroke-width: 1.4; }
.fc .term { fill: #E1EAE8; stroke: currentColor; stroke-width: 1.4; }
.fc .byp { fill: #D5EAED; stroke: #136C7D; stroke-width: 1.6; }
.fc .ro { fill: #F5E2D5; stroke: #A04A15; stroke-width: 1.6; }
.fc .tt { fill: #136C7D; }
.fc .tc { fill: #A04A15; }
.fc .yn { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #4B5D64; }
.rig .tube { fill: none; stroke: #136C7D; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.rig .water { fill: #D5EAED; stroke: none; }
.rig .vessel { fill: none; stroke: currentColor; stroke-width: 1.6; }
.rig .probe { stroke: currentColor; stroke-width: 2.4; }
.rig .cable { stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
</style>
<defs>
<g id="gnd" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-6" y1="4" x2="6" y2="4"/><line x1="-2" y1="8" x2="2" y2="8"/></g>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#136C7D"/></marker>
</defs>
<rect x="0" y="0" width="720" height="300" fill="#FAFCFC"/>
      <g class="tag"><rect x="20" y="189" width="150" height="22" rx="4"/><text x="95" y="204" text-anchor="middle">GPIO25 / 26 / 32</text></g>
      <path class="w" d="M170 200 H200 M240 200 H330"/>
      <rect class="res" x="200" y="193" width="40" height="14"/>
      <text x="220" y="185" text-anchor="middle">R6–R8 220 Ω</text>
      <circle class="dot" cx="270" cy="200" r="3.2"/>
      <path class="w" d="M270 200 V215 M270 255 V265"/>
      <rect class="res" x="263" y="215" width="14" height="40"/>
      <text x="258" y="244" text-anchor="end">R9–R11 10k</text>
      <use href="#gnd" x="270" y="265"/>
      <!-- MOSFET -->
      <line class="pl" x1="330" y1="172" x2="330" y2="228"/>
      <line class="pl" x1="342" y1="166" x2="342" y2="182"/>
      <line class="pl" x1="342" y1="192" x2="342" y2="208"/>
      <line class="pl" x1="342" y1="218" x2="342" y2="234"/>
      <path class="w" d="M342 174 H380 V130"/>
      <path class="w" d="M342 226 H380"/>
      <path class="w" d="M380 200 V280"/>
      <path class="w" d="M380 200 H348" marker-end="url(#ah)"/>
      <use href="#gnd" x="380" y="280"/>
      <text x="318" y="194" text-anchor="end" class="mu">G</text>
      <text x="390" y="158" class="mu">D</text>
      <text x="390" y="254" class="mu">S</text>
      <text class="ttl" x="400" y="205">Q1–Q3 IRLZ44N</text>
      <!-- load -->
      <rect class="md" x="350" y="64" width="60" height="46" rx="4"/>
      <text x="380" y="92" text-anchor="middle">load</text>
      <path class="w" d="M380 64 V46 M380 110 V130"/>
      <text x="340" y="82" text-anchor="end">12 V valve</text>
      <text x="340" y="98" text-anchor="end">or pump</text>
      <circle class="dot" cx="380" cy="46" r="3.2"/>
      <path class="w" d="M380 46 V30"/>
      <g class="tag pwr"><rect x="350" y="8" width="60" height="22" rx="4"/><text x="380" y="23" text-anchor="middle">+12V</text></g>
      <!-- flyback diode -->
      <path class="w" d="M380 46 H480 V68 M480 98 V130 H380"/>
      <line class="pl" x1="466" y1="68" x2="494" y2="68"/>
      <polygon class="dio" points="466,98 494,98 480,70"/>
      <circle class="dot" cx="380" cy="130" r="3.2"/>
      <text class="ttl" x="506" y="82">D1–D3 1N5819</text>
      <text class="mu" x="506" y="100">band towards +12 V</text>
    </svg>
